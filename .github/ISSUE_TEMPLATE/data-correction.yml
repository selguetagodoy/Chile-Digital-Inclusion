name: Data correction / evidence update
description: Report a possible data, source, methodology or documentation correction.
title: "[Data correction] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please provide enough evidence to reproduce and evaluate the proposed correction. Missing values should not be filled by assumption.
  - type: input
    id: location
    attributes:
      label: Dataset / file / field
      description: Identify the affected file, table, field, row, chart or section as precisely as possible.
      placeholder: data/example.csv — field_name — row/market/commune
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current published value or statement
      description: Copy the current value or summarize the current statement.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed correction
      description: State the exact replacement, amendment or status change.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source
      description: Provide the official or technically authoritative source URL or document reference.
      placeholder: https://...
    validations:
      required: true
  - type: input
    id: period
    attributes:
      label: Reference period
      placeholder: 2026Q2 / 1S26 / 2026-09-27 / 2025
    validations:
      required: true
  - type: input
    id: universe
    attributes:
      label: Statistical universe and unit
      placeholder: households / MW IT / connections / institutions / communes
    validations:
      required: true
  - type: textarea
    id: comparability
    attributes:
      label: Comparability or methodology impact
      description: Explain whether this changes definitions, source family, universe, historical comparability or any derived indicator.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional evidence or notes
      description: Add quotations, page numbers, calculations or context needed to verify the correction.
  - type: checkboxes
    id: checks
    attributes:
      label: Evidence checklist
      options:
        - label: I have not filled a missing value by assumption.
          required: true
        - label: I have identified the source period and statistical universe.
          required: true
        - label: I understand that source-specific rights and attribution requirements remain applicable.
          required: true
