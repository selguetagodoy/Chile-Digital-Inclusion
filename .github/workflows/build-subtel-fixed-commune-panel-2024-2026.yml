name: Build SUBTEL fixed commune panel 2024-2026

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtel_fixed_commune_panel_2024_2026.py'
      - 'scripts/build_subtel_fixed_commune_2026.py'
      - '.github/workflows/build-subtel-fixed-commune-panel-2024-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - name: Build and validate commune panel
        run: python scripts/build_subtel_fixed_commune_panel_2024_2026.py
      - name: Commit commune panel
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/fixed_infrastructure_2026/commune_fixed_connectivity_panel_2024_2026.csv \
            data/fixed_infrastructure_2026/commune_fixed_low_intensity_rank_2026.csv \
            data/fixed_infrastructure_2026/source_alignment_qa_panel_2024_2026.csv \
            data/fixed_infrastructure_2026/source_row_mapping_panel_2024_2026.csv \
            data/fixed_infrastructure_2026/extraction_manifest_panel_2024_2026.csv
          if git diff --cached --quiet; then
            echo 'No commune-panel changes'
          else
            git commit -m 'Publish SUBTEL commune fixed-connectivity panel 2024-2026'
            git pull --rebase origin main
            git push
          fi