name: Update README observatory layers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_readme_observatory_layers.py'
      - '.github/workflows/update-readme-observatory-layers.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/update_readme_observatory_layers.py
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'No README changes'
          else
            git commit -m 'Document education and RedAcceso observatory layers'
            git pull --rebase origin main
            git push
          fi
