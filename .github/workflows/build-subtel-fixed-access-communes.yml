name: Build SUBTEL fixed access linework by commune

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtel_fixed_access_communes.py'
      - 'data/fixed_access_infrastructure/service_catalog.csv'
      - 'geo/chile_communes.geojson'
      - 'geo/commune_codes.csv'
      - '.github/workflows/build-subtel-fixed-access-communes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests shapely pyproj
      - name: Aggregate linework by commune
        run: python scripts/build_subtel_fixed_access_communes.py
      - name: Commit aggregate outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixed_access_infrastructure/commune_operator_linework.csv data/fixed_access_infrastructure/commune_fixed_access_linework.csv data/fixed_access_infrastructure/spatial_assignment_coverage.csv
          if git diff --cached --quiet; then
            echo 'No fixed-access aggregation changes'
          else
            git commit -m 'Aggregate SUBTEL fixed-access linework by commune'
            git pull --rebase origin main
            git push
          fi
