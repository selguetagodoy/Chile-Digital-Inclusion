name: Validate public release

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/communal_master/**'
      - 'data/mobile_coverage_2025/**'
      - 'data/fixed_access_infrastructure/**'
      - 'data/education_connectivity_2026/**'
      - 'data/subtel_sector_2026/**'
      - 'data/ookla/**'
      - 'data/metadata/layer_catalog.csv'
      - 'data/metadata/release_manifest.csv'
      - 'geo/**'
      - 'docs/reproducibility.md'
      - 'scripts/validate_public_release.py'
      - 'scripts/validate_release_metadata.py'
      - '.github/workflows/validate-public-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check dashboard JavaScript syntax
        run: node --check assets/dashboard.js

      - name: Validate public data contract
        run: python scripts/validate_public_release.py

      - name: Validate release metadata contract
        run: python scripts/validate_release_metadata.py

      - name: Commit validation report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metadata/public_release_validation.csv
          if git diff --cached --quiet; then
            echo 'No validation-report changes to commit'
          else
            git commit -m 'Refresh public release validation report'
            git pull --rebase origin main
            git push
          fi
