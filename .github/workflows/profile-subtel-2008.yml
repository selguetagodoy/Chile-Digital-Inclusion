name: Profile SUBTEL 2008 legacy survey

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/profile_subtel_2008.py'
      - '.github/workflows/profile-subtel-2008.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          pip install pandas requests pyreadstat
      - name: Profile official 2008 SPSS archive
        run: python scripts/profile_subtel_2008.py
      - name: Show summary
        run: cat data/subtel_2008/summary.json
      - name: Commit aggregate outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_2008
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build aggregate profile from official SUBTEL 2008 SPSS base'
            git pull --rebase origin main
            git push
          fi
