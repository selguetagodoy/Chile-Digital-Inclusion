name: Integrate SUBTEL mobile network points into communal master

on:
  push:
    paths:
      - 'scripts/integrate_mobile_network_points.py'
      - 'data/mobile_coverage_2025/commune_mobile_network_points_2025_03.csv'
      - '.github/workflows/integrate-mobile-network-points.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install pandas

      - name: Integrate mobile network fields
        run: python scripts/integrate_mobile_network_points.py

      - name: Commit integrated master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/communal_master/chile_digital_inclusion_communes_2026_integrated.csv
          if git diff --cached --quiet; then
            echo 'No integrated-master changes to commit'
          else
            git commit -m 'Integrate SUBTEL 4G and 5G network records into communal master'
            git pull --rebase origin main
            git push
          fi
