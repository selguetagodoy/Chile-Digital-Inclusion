name: Catalog SUBTEL fixed access services

on:
  push:
    branches: [main]
    paths:
      - 'scripts/catalog_subtel_fixed_access.py'
      - '.github/workflows/catalog-subtel-fixed-access.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Inspect public ArcGIS services
        run: python scripts/catalog_subtel_fixed_access.py
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/fixed_access_infrastructure/
          if git diff --cached --quiet; then
            echo 'No catalog changes'
          else
            git commit -m 'Catalog SUBTEL fixed-access ArcGIS services'
            git pull --rebase origin main
            git push
          fi
