name: Document fixed infrastructure fields

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_dictionary_fixed_infrastructure.py'
      - '.github/workflows/patch-dictionary-fixed-infrastructure.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python scripts/patch_dictionary_fixed_infrastructure.py
      - run: python scripts/build_communal_dictionary.py
      - name: Commit dictionary source and outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/build_communal_dictionary.py data/metadata/communal_master_dictionary.csv docs/communal_master_dictionary.md
          if git diff --cached --quiet; then
            echo 'No dictionary changes'
          else
            git commit -m 'Document reconciled SUBTEL fixed infrastructure in communal dictionary'
            git pull --rebase origin main
            git push
          fi
