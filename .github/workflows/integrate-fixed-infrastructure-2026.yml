name: Integrate SUBTEL fixed infrastructure 2026

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_fixed_infrastructure_2026.py'
      - 'data/fixed_infrastructure_2026/commune_fixed_connections_2026_03.csv'
      - '.github/workflows/integrate-fixed-infrastructure-2026.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate fixed infrastructure
        run: python scripts/integrate_fixed_infrastructure_2026.py
      - name: Commit master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/communal_master/chile_digital_inclusion_communes_2026_integrated.csv
          if git diff --cached --quiet; then
            echo 'No master changes'
          else
            git commit -m 'Integrate SUBTEL fixed connections March 2026 into communal master'
            git pull --rebase origin main
            git push
          fi
