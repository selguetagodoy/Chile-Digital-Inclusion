name: Harden workflow writers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/harden_workflow_writers.py'
      - '.github/workflows/harden-workflow-writers.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden writer workflows
        run: python3 scripts/harden_workflow_writers.py
      - name: Commit hardened workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'No workflow hardening changes'
            exit 0
          fi
          git commit -m 'Harden Actions writers against concurrent pushes [skip ci]'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying"
            sleep $((attempt * 2))
          done
          echo 'Unable to publish hardened workflows after retries' >&2
          exit 1
