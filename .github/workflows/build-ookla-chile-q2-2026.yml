name: Build Ookla Chile Q2 2026

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb fiona numpy pyarrow requests shapely pandas geopandas pyogrio

      - name: Build Chile Q2 2026 and Q1 2026 control
        run: |
          python scripts/build_ookla_chile_quarter.py \
            --year 2026 --quarter 2 \
            --compare-year 2026 --compare-quarter 1

      - name: Validate national outputs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          summary = Path('data/ookla/chile_2026q2_summary.csv')
          comparison = Path('data/ookla/chile_2026q1_vs_2026q2.csv')
          assert summary.exists() and comparison.exists()
          with summary.open(encoding='utf-8', newline='') as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == 2
          assert {r['network'] for r in rows} == {'fixed', 'mobile'}
          assert {r['quarter'] for r in rows} == {'2'}
          for row in rows:
              assert int(row['tiles']) > 0 and int(row['tests']) > 0
              assert row['source_url'].endswith(f"2026-04-01_performance_{row['network']}_tiles.parquet")
          print('National Q2 validated')
          PY

      - name: Build Q2 communal and regional layers
        run: python scripts/build_ookla_territorial_q2_2026.py

      - name: Validate territorial outputs
        run: |
          python - <<'PY'
          import pandas as pd
          comm = pd.read_csv('data/ookla/territorial/chile_2026q2_communes.csv')
          reg = pd.read_csv('data/ookla/territorial/chile_2026q2_regions.csv')
          cmpc = pd.read_csv('data/ookla/territorial/chile_2026q1_vs_2026q2_communes.csv')
          master = pd.read_csv('data/communal_master/chile_digital_inclusion_communes_2026_integrated.csv')
          coverage = pd.read_csv('data/ookla/territorial/spatial_assignment_coverage_q1_q2.csv')
          assert set(comm['period']) == {'2026Q2'}
          assert set(comm['network']) == {'fixed', 'mobile'}
          assert set(reg['period']) == {'2026Q2'}
          assert master['comuna'].nunique() == 346
          assert master.shape[1] == 117, master.shape
          assert 'ookla_fixed_download_mbps_2026q2' in master.columns
          assert 'ookla_mobile_download_mbps_2026q2' in master.columns
          assert 'ookla_fixed_download_delta_pct_q1_to_q2' in master.columns
          assert 'ookla_mobile_download_delta_pct_q1_to_q2' in master.columns
          assert set(coverage['period']) == {'2026Q1', '2026Q2'}
          assert len(cmpc) > 0
          print('Territorial Q2 validated:', comm.shape, reg.shape, master.shape)
          print(coverage.to_string(index=False))
          PY

      - name: Validate reproducible release locally
        run: |
          python scripts/promote_ookla_q2_2026.py
          python scripts/build_release_metadata.py
          python scripts/validate_public_release.py
          git diff --stat
