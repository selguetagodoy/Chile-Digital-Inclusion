name: Catalog SUBTEL mobile coverage services

on:
  push:
    paths:
      - 'scripts/catalog_subtel_mobile_coverage.py'
      - '.github/workflows/catalog-subtel-mobile-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Catalog ArcGIS services
        run: python scripts/catalog_subtel_mobile_coverage.py

      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mobile_coverage_2025/service_catalog.csv
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit'
          else
            git commit -m 'Catalog SUBTEL 4G and 5G public services'
            git pull --rebase origin main
            git push
          fi
