name: Extract Mineduc CpE2030 2026 selection document

on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_mineduc_cpe2030_2026.py'
      - '.github/workflows/extract-mineduc-cpe2030-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests pdfplumber
      - name: Extract RBD candidates from public REX 497
        run: python scripts/extract_mineduc_cpe2030_2026.py
      - name: Commit audit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/education_connectivity_2026/
          if git diff --cached --quiet; then
            echo 'No education extraction changes'
          else
            git commit -m 'Extract CpE2030 2026 RBD candidates for audit'
            git pull --rebase origin main
            git push
          fi
