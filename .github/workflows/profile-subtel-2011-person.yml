name: Profile SUBTEL 2011 person survey

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/profile_subtel_2011_person.py'
      - '.github/workflows/profile-subtel-2011-person.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests pyreadstat
      - name: Recover and profile official 2011 person SAV
        run: python scripts/profile_subtel_2011_person.py
      - name: Show summary
        run: cat data/subtel_2011_person/summary.json
      - name: Commit aggregate outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_2011_person
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build aggregate profile from official SUBTEL 2011 person base'
            git pull --rebase origin main
            git push
          fi
