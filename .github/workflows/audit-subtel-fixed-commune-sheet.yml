name: Audit SUBTEL fixed connections by commune sheet

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_subtel_fixed_commune_sheet.py'
      - '.github/workflows/audit-subtel-fixed-commune-sheet.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - run: python scripts/audit_subtel_fixed_commune_sheet.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_sector_series/fixed_commune_sheet_audit.csv \
                  data/subtel_sector_series/fixed_commune_source_rows_2026_03.csv
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'Audit SUBTEL fixed connections by commune source rows'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Concurrent push detected; retrying publication (${attempt}/4)"
              sleep $((attempt * 2))
            done
            echo 'Unable to publish audit after retries'
            exit 1
          fi
