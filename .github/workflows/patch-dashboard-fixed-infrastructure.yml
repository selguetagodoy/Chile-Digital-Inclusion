name: Add fixed infrastructure to dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_dashboard_fixed_infrastructure.py'
      - '.github/workflows/patch-dashboard-fixed-infrastructure.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_dashboard_fixed_infrastructure.py
      - run: node --check assets/dashboard.js
      - name: Commit dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard.js
          if git diff --cached --quiet; then
            echo 'No dashboard changes'
          else
            git commit -m 'Expose SUBTEL fixed infrastructure in dashboard'
            git pull --rebase origin main
            git push
          fi
