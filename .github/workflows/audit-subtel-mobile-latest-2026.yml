name: Audit latest SUBTEL mobile technology rows

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_subtel_mobile_latest_2026.py'
      - '.github/workflows/audit-subtel-mobile-latest-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - run: python scripts/audit_subtel_mobile_latest_2026.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_sector_series/latest_mobile_row_audit.csv
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'Audit latest SUBTEL mobile technology rows'
            git pull --rebase origin main
            git push
          fi
