name: Profile official SUBTEL sector XLSX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/profile_subtel_sector_xlsx.py'
      - 'scripts/inspect_subtel_fixed_commune_sheet.py'
      - '.github/workflows/profile-subtel-sector-xlsx.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Profile official XLSX files
        run: |
          python scripts/profile_subtel_sector_xlsx.py
          python scripts/inspect_subtel_fixed_commune_sheet.py
      - name: Commit profile outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_sector_2026/xlsx_profile/
          if git diff --cached --quiet; then
            echo 'No XLSX profile changes'
          else
            git commit -m 'Profile official SUBTEL March 2026 sector workbooks'
            git pull --rebase origin main
            git push
          fi
