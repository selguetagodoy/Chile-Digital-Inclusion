name: Build communal data dictionary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_communal_dictionary.py'
      - 'data/communal_master/chile_digital_inclusion_communes_2026_integrated.csv'
      - 'data/mobile_coverage_2025/commune_mobile_network_points_2025_03.csv'
      - '.github/workflows/build-communal-dictionary.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install pandas
      - name: Build dictionary when integrated master exists
        id: build
        run: |
          if [ -f data/communal_master/chile_digital_inclusion_communes_2026_integrated.csv ]; then
            python scripts/build_communal_dictionary.py
            echo 'built=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'Integrated master not present yet; waiting for territorial workflow.'
            echo 'built=no' >> "$GITHUB_OUTPUT"
          fi
      - name: Commit dictionary
        if: steps.build.outputs.built == 'yes'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metadata/communal_master_dictionary.csv docs/communal_master_dictionary.md
          if git diff --cached --quiet; then
            echo 'No dictionary changes to commit'
          else
            git commit -m 'Document integrated communal master variables'
            git pull --rebase origin main
            git push
          fi
