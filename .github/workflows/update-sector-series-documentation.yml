name: Update SUBTEL sector series documentation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_sector_series_documentation.py'
      - '.github/workflows/update-sector-series-documentation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_sector_series_documentation.py
      - name: Commit documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/reproducibility.md
          if git diff --cached --quiet; then
            echo 'No documentation changes'
          else
            git commit -m 'Document longitudinal SUBTEL sector series'
            git pull --rebase origin main
            git push
          fi
