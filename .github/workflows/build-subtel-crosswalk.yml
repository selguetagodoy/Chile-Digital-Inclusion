name: Build SUBTEL harmonization crosswalk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtel_crosswalk.py'
      - '.github/workflows/build-subtel-crosswalk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - run: python scripts/build_subtel_crosswalk.py
      - name: Commit crosswalk candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_microdata/top_harmonization_candidates.csv
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build SUBTEL harmonization crosswalk candidates'
            git push
          fi
