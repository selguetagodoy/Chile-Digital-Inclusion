name: Validate workflow integrity

# Strict repository-wide workflow contract check.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      STRICT_WRITERS: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow contracts
        run: python3 scripts/validate_workflow_integrity.py
