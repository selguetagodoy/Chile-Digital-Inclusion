name: Build Ookla Q2 validated speed rankings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/ookla/territorial/chile_2026q1_vs_2026q2_change_validation.csv'
      - 'scripts/build_ookla_q2_speed_rankings_validated.py'
      - '.github/workflows/build-ookla-q2-speed-rankings-validated.yml'

concurrency:
  group: main-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check pandas
      - name: Build validated rankings
        run: python scripts/build_ookla_q2_speed_rankings_validated.py
      - name: Validate output
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'data/ookla/territorial/chile_2026q2_speed_rankings_validated.csv'
          df = pd.read_csv(p)
          fixed = df[df.network == 'fixed']
          mobile = df[df.network == 'mobile']
          assert set(df['network']) == {'fixed', 'mobile'}
          assert len(fixed) == 83
          assert len(mobile) == 25
          assert fixed['above_mean_tests_reference'].astype(str).str.lower().eq('true').all()
          assert mobile['mean_tests_q1_q2'].ge(1000).all()
          assert df.groupby('network')['rank_speed_desc_validated'].min().eq(1).all()
          print(df.groupby('network').size())
          print('mobile minimum mean tests:', mobile['mean_tests_q1_q2'].min())
          PY
      - name: Commit output
        run: |
          git add data/ookla/territorial/chile_2026q2_speed_rankings_validated.csv
          if git diff --cached --quiet; then
            echo 'No ranking changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build validated Ookla Q2 speed rankings'
          git pull --rebase origin main
          git push origin HEAD:main
