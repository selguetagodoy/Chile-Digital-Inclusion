name: Profile Mineduc Aulas Conectadas selected sheet

on:
  push:
    branches: [main]
    paths:
      - 'scripts/profile_mineduc_aulas_selected_sheet.py'
      - '.github/workflows/profile-mineduc-aulas-selected-sheet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - run: python scripts/profile_mineduc_aulas_selected_sheet.py
      - name: Commit profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/education_connectivity_2026/aulas_conectadas_2025_sheet_*.csv
          if git diff --cached --quiet; then
            echo 'No sheet profile changes'
          else
            git commit -m 'Profile official Aulas Conectadas 2025 selection sheet'
            git pull --rebase origin main
            git push
          fi
