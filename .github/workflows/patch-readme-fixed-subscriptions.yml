name: Synchronize README fixed subscriptions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_readme_fixed_subscriptions.py'
      - '.github/workflows/patch-readme-fixed-subscriptions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_readme_fixed_subscriptions.py
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            echo 'No README changes'
          else
            git commit -m 'Document SUBTEL fixed subscriptions by commune'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Concurrent push detected; retrying publication (${attempt}/4)"
              sleep $((attempt * 2))
            done
            echo 'Unable to publish README after retries'
            exit 1
          fi
