name: Audit current SUBTEL fixed technology sheets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_subtel_fixed_current_technology.py'
      - '.github/workflows/audit-subtel-fixed-current-technology.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - run: python scripts/audit_subtel_fixed_current_technology.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_sector_series/current_fixed_technology_sheet_audit.csv
          if git diff --cached --quiet; then
            echo 'No audit changes'
          else
            git commit -m 'Audit current SUBTEL fixed technology sheets'
            git pull --rebase origin main
            git push
          fi
