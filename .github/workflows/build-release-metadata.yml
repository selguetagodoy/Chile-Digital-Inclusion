name: Build release metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_release_metadata.py'
      - 'data/**'
      - '!data/metadata/layer_catalog.csv'
      - '!data/metadata/release_manifest.csv'
      - 'geo/**'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - 'CITATION.cff'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-release-metadata.yml'
  workflow_run:
    workflows:
      - 'Build SUBTEL sector series through March 2026'
      - 'Build SUBTEL fixed connections by commune March 2026'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build layer catalog and file manifest
        run: python scripts/build_release_metadata.py
      - name: Commit metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metadata/layer_catalog.csv data/metadata/release_manifest.csv
          if git diff --cached --quiet; then
            echo 'No release metadata changes'
          else
            git commit -m 'Refresh public layer catalog and release manifest'
            git pull --rebase origin main
            git push
          fi
