name: Build release metadata

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_release_metadata.py'
      - 'data/**'
      - '!data/metadata/layer_catalog.csv'
      - '!data/metadata/release_manifest.csv'
      - 'geo/**'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - 'CITATION.cff'
      - 'index.html'
      - 'assets/**'
      - '.github/workflows/build-release-metadata.yml'
  workflow_run:
    workflows:
      - 'Build SUBTEL sector series through March 2026'
      - 'Build SUBTEL fixed connections by commune March 2026'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and publish metadata safely
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4 5; do
            echo "Metadata publication attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main

            python scripts/build_release_metadata.py
            git add data/metadata/layer_catalog.csv data/metadata/release_manifest.csv

            if git diff --cached --quiet; then
              echo 'Release metadata already current'
              exit 0
            fi

            git commit -m 'Refresh public layer catalog and release manifest'
            if git push origin HEAD:main; then
              echo 'Release metadata published'
              exit 0
            fi

            echo 'main advanced during metadata publication; rebuilding on the new head'
            sleep $((attempt * 2))
          done

          echo 'Unable to publish release metadata after 5 rebuild attempts' >&2
          exit 1
