name: Profile SUBTEL survey microdata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/profile_subtel_microdata.py'
      - 'scripts/build_subtel_weighted_profiles.py'
      - 'scripts/classify_subtel_variables.py'
      - '.github/workflows/profile-subtel-microdata.yml'

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pyreadstat

      - name: Download and profile official SUBTEL bases
        run: |
          python scripts/profile_subtel_microdata.py

      - name: Build household and person weighted profiles
        run: |
          python scripts/build_subtel_weighted_profiles.py

      - name: Classify variables for harmonization
        run: |
          python scripts/classify_subtel_variables.py

      - name: Show profile summaries
        run: |
          echo '--- generic profile ---'
          cat data/subtel_microdata/profile_summary.json
          echo '--- weighted profile ---'
          cat data/subtel_weighted/summary.json
          echo '--- domain coverage ---'
          cat data/subtel_microdata/harmonization_domain_coverage.csv
          echo '--- weighted processing errors ---'
          cat data/subtel_weighted/processing_errors.csv || true

      - name: Commit aggregate outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_microdata data/subtel_weighted
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Build aggregate, weighted and harmonization profiles from SUBTEL surveys'
            git pull --rebase origin main
            git push
          fi
