name: Build SUBTEL sector series through June 2026

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtel_sector_series_2026.py'
      - 'scripts/build_subtel_market_dynamics_2026.py'
      - 'scripts/build_subtel_market_derived_2026.py'
      - 'scripts/qa_normalize_subtel_fixed_periods.py'
      - '.github/workflows/build-subtel-sector-series-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - name: Build normalized core series
        run: python scripts/build_subtel_sector_series_2026.py
      - name: Build market dynamics longitudinal series
        run: python scripts/build_subtel_market_dynamics_2026.py
      - name: Build derived market analytics
        run: python scripts/build_subtel_market_derived_2026.py
      - name: Normalize overlapping fixed periods and QA
        run: python scripts/qa_normalize_subtel_fixed_periods.py
      - name: Commit normalized sector series
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/subtel_sector_series/fixed_connections_monthly.csv \
            data/subtel_sector_series/fixed_technology_snapshot_2026_06.csv \
            data/subtel_sector_series/mobile_connections_by_technology_monthly.csv \
            data/subtel_sector_series/mobile_data_traffic_monthly.csv \
            data/subtel_sector_series/fixed_data_traffic_monthly.csv \
            data/subtel_sector_series/sector_core_monthly_long.csv \
            data/subtel_sector_series/sector_core_december_long_2000_2025.csv \
            data/subtel_sector_series/series_qa.csv \
            data/subtel_sector_series/fixed_connections_by_plan_monthly.csv \
            data/subtel_sector_series/mobile_connections_by_plan_monthly.csv \
            data/subtel_sector_series/fixed_connections_by_operator_monthly.csv \
            data/subtel_sector_series/mobile_connections_by_operator_monthly.csv \
            data/subtel_sector_series/fixed_satellite_operator_connections_monthly.csv \
            data/subtel_sector_series/mobile_traffic_by_operator_monthly.csv \
            data/subtel_sector_series/fixed_traffic_by_operator_monthly.csv \
            data/subtel_sector_series/mobile_traffic_by_plan_monthly.csv \
            data/subtel_sector_series/market_dynamics_comparisons_2024_2026.csv \
            data/subtel_sector_series/market_dynamics_qa.csv \
            data/subtel_sector_series/mobile_plan_usage_intensity_monthly.csv \
            data/subtel_sector_series/mobile_operator_connections_vs_traffic_growth.csv \
            data/subtel_sector_series/fixed_traffic_by_group_monthly.csv \
            data/subtel_sector_series/fixed_operator_connections_vs_traffic_growth.csv \
            data/subtel_sector_series/satellite_provider_dynamics_monthly.csv \
            data/subtel_sector_series/mobile_4g_5g_convergence_monthly.csv \
            data/subtel_sector_series/mobile_4g_5g_convergence_summary.csv
          if git diff --cached --quiet; then
            echo 'No normalized sector-series changes'
          else
            git commit -m 'Publish normalized SUBTEL sector series through June 2026'
            git pull --rebase origin main
            git push
          fi