name: Build SUBTEL sector series through March 2026

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_subtel_sector_series_2026.py'
      - '.github/workflows/build-subtel-sector-series-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl
      - name: Build normalized series
        run: python scripts/build_subtel_sector_series_2026.py
      - name: Commit normalized sector series
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/subtel_sector_series/fixed_connections_monthly.csv data/subtel_sector_series/fixed_technology_snapshot_2026_03.csv data/subtel_sector_series/mobile_connections_by_technology_monthly.csv data/subtel_sector_series/mobile_data_traffic_monthly.csv data/subtel_sector_series/fixed_data_traffic_monthly.csv data/subtel_sector_series/sector_core_monthly_long.csv data/subtel_sector_series/sector_core_december_long_2000_2025.csv data/subtel_sector_series/series_qa.csv
          if git diff --cached --quiet; then
            echo 'No normalized sector-series changes'
          else
            git commit -m 'Publish normalized SUBTEL sector series through March 2026'
            git pull --rebase origin main
            git push
          fi
