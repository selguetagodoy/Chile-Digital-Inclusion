name: Update dashboard integrated layers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_dashboard_integrated_layers.py'
      - '.github/workflows/update-dashboard-integrated-layers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update dashboard files
        run: python scripts/update_dashboard_integrated_layers.py
      - name: Check JavaScript syntax
        run: node --check assets/dashboard.js
      - name: Commit dashboard changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dashboard.js index.html
          if git diff --cached --quiet; then
            echo 'No dashboard changes'
          else
            git commit -m 'Expose education and RedAcceso context in dashboard'
            git pull --rebase origin main
            git push
          fi
