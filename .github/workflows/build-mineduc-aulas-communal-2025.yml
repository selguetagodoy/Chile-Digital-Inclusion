name: Build Mineduc Aulas Conectadas communal layer 2025

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_mineduc_aulas_communal_2025.py'
      - 'data/education_connectivity_2026/aulas_conectadas_2025_establishments.csv'
      - 'geo/commune_codes.csv'
      - '.github/workflows/build-mineduc-aulas-communal-2025.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive extractors
        run: sudo apt-get update -qq && sudo apt-get install -y unar p7zip-full
      - run: pip install requests
      - name: Crosswalk RBD with official Mineduc directory
        run: python scripts/build_mineduc_aulas_communal_2025.py
      - name: Commit education communal outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/education_connectivity_2026/aulas_conectadas_2025_establishments_enriched.csv data/education_connectivity_2026/aulas_conectadas_2025_commune_summary.csv data/education_connectivity_2026/aulas_conectadas_2025_crosswalk_qa.csv
          if git diff --cached --quiet; then
            echo 'No education communal changes'
          else
            git commit -m 'Build official Aulas Conectadas 2025 communal layer'
            git pull --rebase origin main
            git push
          fi
